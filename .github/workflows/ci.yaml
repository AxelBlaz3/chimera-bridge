name: chimera_bridge

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze .

      - name: Format
        run: dart format --set-exit-if-changed lib test chimera_bridge/hooks

      - name: Run Tests
        run: dart test
